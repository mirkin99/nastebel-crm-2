<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nastebel · Коммуникации</title><style>
:root{--bg:#f4f3ef;--ink:#253b34;--muted:#7a837b;--line:#dfe3da;--green:#284e3d;--pink:#eaccc8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button,a,input,select,textarea{outline-color:#759683}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:10px 15px}button:hover{border-color:#81978a}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--green);color:white;border-color:var(--green)}.danger{color:#a34242}.small{font-size:12px;padding:5px 9px}a{color:var(--green)}header{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;background:#fff;border-bottom:1px solid var(--line);gap:15px}.brand{font:32px Georgia,serif;letter-spacing:-1px}.brand small{font:11px system-ui;letter-spacing:2px;margin-left:20px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}main{padding:30px 32px}h1{font:36px Georgia,serif;margin:0 0 8px}h2{font:26px Georgia,serif;margin:0 0 18px}h3{margin:0 0 8px;font-size:17px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.intro{display:flex;align-items:center;justify-content:space-between;gap:16px}.stats{display:flex;gap:10px;margin:24px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 20px;min-width:135px}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}input,textarea,select{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:10px;width:100%}textarea{resize:vertical;min-height:85px}label{font-size:13px;display:block;margin-bottom:13px}label>input,label>textarea,label>select{display:block;margin-top:5px}.tabs{display:flex;gap:5px}.tabs .selected{background:var(--green);color:white}.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow:auto;align-items:start;padding-bottom:16px}.column{background:#eaece6;border-radius:14px;min-height:380px;padding:12px}.column-title{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--color);padding:12px 3px 16px;font-size:13px;font-weight:650}.count{background:#fff;padding:2px 8px;border-radius:8px;color:var(--muted)}.card{background:white;padding:17px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-2px);box-shadow:0 5px 18px #284e3d0d}.card h3{font-size:16px}.card p{font-size:12px;color:var(--muted)}.card select{font-size:12px;padding:6px;margin-top:12px}.task-mark{font-size:12px;border-radius:5px;padding:5px 8px;background:#f1f3ee;margin-top:12px}.due{background:#fbefd9;color:#8b6424}.overdue{background:#fae5e3;color:#a34b42}.empty{font-size:13px;color:var(--muted);padding:22px 8px}.list{display:grid;gap:12px}.list .card{margin:0}.task-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:16px;border-radius:12px;background:#fff}.task-row input{width:20px}.task-row .text{flex:1}.badge{background:#eef1e9;border-radius:8px;padding:5px 10px;font-size:12px}.banner{padding:11px 18px;background:#edf1e9;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:20px}.banner.cloud{background:#e0eee6}dialog{border:1px solid var(--line);border-radius:18px;width:min(780px,calc(100% - 24px));padding:26px;max-height:92vh;color:var(--ink);background:var(--bg)}dialog::backdrop{background:#172b2580}.dialog-top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:16px}.dialog-top h2{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.full{grid-column:1/-1}.panel{background:#fff;padding:18px;border:1px solid var(--line);border-radius:12px;margin:16px 0}.contact{border-bottom:1px solid var(--line);padding:12px 0}.contact:last-child{border:0}.contact .actions{margin-top:8px}.event{padding:14px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}.event:last-child{border:0}.event .actions{float:right}.foot{position:sticky;bottom:-26px;background:var(--bg);padding:18px 0 0;display:flex;justify-content:flex-end;gap:8px}.error{color:#a34242;font-size:13px;white-space:pre-wrap}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:12px 20px;border-radius:12px;z-index:10;max-width:90%}.hidden{display:none!important}.note{white-space:pre-wrap}.contact-editor{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.import-preview{max-height:240px;overflow:auto}.form-hint{margin:6px 0 16px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}@media(max-width:700px){header{padding:16px;align-items:start}.brand{font-size:27px}.brand small{display:block;margin:0;font-size:9px}main{padding:20px 14px}h1{font-size:30px}.intro{align-items:start}.intro .primary{white-space:nowrap}.stats{gap:6px;overflow:auto;margin:18px 0}.stat{min-width:105px;padding:9px 12px;font-size:12px}.stat b{font-size:22px}.board{grid-template-columns:repeat(5,270px);scroll-snap-type:x proximity}.column{scroll-snap-align:start}.grid{grid-template-columns:1fr}.full{grid-column:auto}dialog{padding:18px}.foot{bottom:-18px}.toolbar{margin:16px 0}.banner{display:block}.banner button{margin-top:8px}.tabs{width:100%}.tabs button{flex:1}.actions{gap:5px}}
</style></head><body><header><div class="brand">nastebel<small>КЛИЕНТЫ И КОММУНИКАЦИИ</small></div><div class="actions"><button id="exportBtn" class="small">Экспорт</button><button id="cloudBtn" class="small">Подключить Supabase</button></div></header><main><div id="banner" class="banner"></div><div class="intro"><div><h1>От знакомства к сотрудничеству</h1><div class="muted">Компании, договорённости и следующий шаг — в одном месте.</div></div><button class="primary" id="addBtn">+ Добавить</button></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" aria-label="Поиск" placeholder="Найти компанию, контакт, телефон…"><button id="importBtn">Вставить отчёт</button><select id="taskFilter" style="width:auto" aria-label="Фильтр задач"><option value="all">Все компании</option><option value="due">Контакт сегодня / просрочен</option><option value="none">Нет следующего действия</option></select><div class="tabs"><button data-view="board" class="selected">Воронка</button><button data-view="list">Компании</button><button data-view="tasks">Задачи</button></div></div><div id="content"></div></main><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const SEED = [];
const STAGES=[['first','Первичный обход','#9ba99b'],['talk','Переговоры','#c1ad82'],['test','Тестовая поставка','#d79d95'],['active','Сотрудничество','#64967a'],['lost','Неактуально','#a7a7aa']];
const API='https://xjvktqjlooquiewkvsmk.supabase.co/functions/v1/nastebel-communications-api';
const LOGIN='https://xjvktqjlooquiewkvsmk.supabase.co/functions/v1/nastebel-crm-api';
const KEY='nastebel_communications_preview_v1';
let rows=[],mode='local',view='board',selected=null,busy=false,clients=[];
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x)),uid=()=>crypto.randomUUID(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(new Date()),date=d=>d?new Date(d.slice(0,10)+'T12:00:00').toLocaleDateString('ru-RU'):'Без срока';
const stage=s=>STAGES.find(x=>x[0]===s)?.[1]||s;
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const identity=d=>norm(d.name)+'|'+norm(d.location);
function phone(p){let x=String(p||'').replace(/\D/g,'');if(x.length===11&&x[0]==='8')x='7'+x.slice(1);if(x.length===10)x='7'+x;if(!/^\d{7,15}$/.test(x))return '';return x}
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function err(e){const box=$('formError');if(box)box.textContent=e.message||e;else notify(e.message||e)}
function localLoad(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');rows=Array.isArray(saved)?saved:SEED.map(document=>({id:document.id,document:clone(document),revision:1}));}catch(e){rows=SEED.map(document=>({id:document.id,document:clone(document),revision:1}));notify('Локальное хранилище недоступно. Сохраняйте экспорт.')}}
function options(value){return STAGES.map(([s,n])=>`<option value="${s}" ${s===value?'selected':''}>${n}</option>`).join('')}
function next(d){return d.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))[0]}
function marker(d){const t=next(d);if(!t)return '<div class="task-mark">Нет следующего действия</div>';return `<div class="task-mark ${t.date&&t.date<today()?'overdue':t.date===today()?'due':''}">${esc(t.text)}<br>${date(t.date)}</div>`}
function filtered(){const q=norm($('search').value),f=$('taskFilter').value;return rows.filter(r=>{const d=r.document,t=next(d);return norm(JSON.stringify(d)).includes(q)&&(f==='all'||f==='due'&&t?.date&&t.date<=today()||f==='none'&&!t)})}
function card(r){const d=r.document;return `<article class="card" data-open="${d.id}" tabindex="0" role="button" aria-label="Открыть ${esc(d.name)}"><h3>${esc(d.name)}</h3><p>${esc([d.sector,d.location].filter(Boolean).join(' · '))}</p><p>${esc(d.contacts.map(c=>c.name).filter(Boolean).join(', ')||'Контакт пока не указан')}</p>${marker(d)}<select data-status="${d.id}" aria-label="Статус ${esc(d.name)}">${options(d.status)}</select>${d.status==='lost'?`<p>Причина: ${esc(d.reason)}</p>`:''}</article>`}
function render(){
 $('banner').className='banner'+(mode==='cloud'?' cloud':'');$('banner').innerHTML=mode==='cloud'?'<span>Supabase подключён · Изменения сохраняются в общей базе CRM.</span><div class="actions"><button id="refreshBtn" class="small">Обновить</button><button id="localBtn" class="small">Вернуться к просмотру</button></div>':'<span>Режим просмотра · Изменения сохраняются только в этом браузере. Облачная база отдельно.</span>';
 $('cloudBtn').textContent=mode==='cloud'?'Supabase подключён':'Подключить Supabase';
 const active=rows.filter(r=>['talk','test'].includes(r.document.status)).length,due=rows.filter(r=>r.document.tasks.some(t=>!t.done&&t.date&&t.date<=today())).length;
 $('stats').innerHTML=`<div class="stat"><b>${rows.length}</b>компаний</div><div class="stat"><b>${active}</b>в работе</div><div class="stat"><b>${due}</b>ждут контакта</div><div class="stat"><b>${rows.filter(r=>r.document.status==='active').length}</b>сотрудничают</div>`;
 const list=filtered();
 if(view==='board')$('content').innerHTML='<div class="board">'+STAGES.map(([s,n,color])=>{const l=list.filter(r=>r.document.status===s);return `<section class="column" style="--color:${color}"><div class="column-title">${n}<span class="count">${l.length}</span></div>${l.map(card).join('')||'<div class="empty">Пока нет компаний</div>'}</section>`}).join('')+'</div>';
 else if(view==='list')$('content').innerHTML='<div class="list">'+(list.map(card).join('')||'<div class="empty">Ничего не найдено</div>')+'</div>';
 else{const ts=list.flatMap(r=>r.document.tasks.map(t=>({r,t}))).sort((a,b)=>Number(a.t.done)-Number(b.t.done)||(a.t.date||'9999').localeCompare(b.t.date||'9999'));$('content').innerHTML='<div class="list">'+(ts.map(({r,t})=>`<div class="task-row"><input type="checkbox" aria-label="Выполнить задачу" data-task="${t.id}" data-company="${r.id}" ${t.done?'checked':''}><div class="text"><b>${esc(t.text)}</b><div class="muted">${esc(r.document.name)} · ${date(t.date)}${t.done?' · Выполнено':''}</div></div><button class="small" data-open="${r.id}">Карточка</button></div>`).join('')||'<div class="empty">Нет задач. Добавьте следующий шаг в карточке компании.</div>')+'</div>'}
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));
 if($('refreshBtn'))$('refreshBtn').onclick=()=>refresh().catch(err);if($('localBtn'))$('localBtn').onclick=()=>{mode='local';clients=[];localLoad();render()};
}
async function request(action,data={}){const token=localStorage.getItem('nastebel_crm_session')||'';const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...data})});const b=await res.json();if(!res.ok){if(res.status===401)localStorage.removeItem('nastebel_crm_session');throw new Error(b.error||'Ошибка сервера')}return b}
async function refresh(){const r=await request('load');rows=r.data;render()}
async function save(items){
 if(busy)throw new Error('Дождитесь сохранения');busy=true;document.querySelectorAll('#modal button').forEach(x=>x.disabled=true);
 try{if(mode==='cloud'){const r=await request('save',{items});rows=r.data}else{const updated=clone(rows);for(const i of items){const j=updated.findIndex(r=>r.id===i.document.id);if(j<0)updated.push({id:i.document.id,document:clone(i.document),revision:1});else {if(updated[j].revision!==i.revision)throw new Error('Карточка изменена. Откройте заново.');updated[j]={id:i.document.id,document:clone(i.document),revision:i.revision+1}}}localStorage.setItem(KEY,JSON.stringify(updated));rows=updated}render()}finally{busy=false;document.querySelectorAll('#modal button').forEach(x=>x.disabled=false)}
}
function show(html){$('modal').innerHTML=html;$('modal').showModal();$('modal').querySelector('[data-close]').onclick=()=>$('modal').close()}
function top(title){return `<div class="dialog-top"><h2>${esc(title)}</h2><button data-close class="small" aria-label="Закрыть">Закрыть</button></div>`}
function stamp(d,text,type='system',when=today()){d.events.push({id:uid(),date:when,type,text})}
async function statusChange(id,s){const r=rows.find(r=>r.id===id);if(!r)return;const d=clone(r.document);if(d.status===s)return;if(s==='lost'){const reason=prompt('Почему сотрудничество неактуально?',d.reason||'');if(!reason?.trim()){render();return}d.reason=reason.trim()}else d.reason='';stamp(d,`Статус: ${stage(d.status)} → ${stage(s)}${s==='lost'?' · '+d.reason:''}`);d.status=s;try{await save([{document:d,revision:r.revision}]);notify('Статус обновлён')}catch(e){render();err(e)}}
function links(c){const p=phone(c.phone),tg=String(c.telegram||'').replace(/^@/,'');return `<div class="actions">${p?`<a href="tel:+${p}">Позвонить</a><a href="${tg&&/^[a-zA-Z0-9_]{5,32}$/.test(tg)?'https://t.me/'+tg:'https://t.me/+'+p}" target="_blank" rel="noopener">Telegram</a><a href="https://wa.me/${p}" target="_blank" rel="noopener">WhatsApp</a><button class="small" data-copy="+${p}">Копировать номер</button>`:tg&&/^[a-zA-Z0-9_]{5,32}$/.test(tg)?`<a href="https://t.me/${tg}" target="_blank" rel="noopener">Telegram</a>`:''}${c.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)?`<a href="mailto:${esc(c.email)}">Почта</a>`:''}</div>`}
function openCard(id){const r=rows.find(x=>x.id===id);if(!r)return;selected=id;const d=r.document;
 show(top(d.name)+`<div class="muted">${esc([d.sector,d.location].filter(Boolean).join(' · '))}</div><div class="chips"><span class="badge">${stage(d.status)}</span>${d.client_id?'<span class="badge">Связан с клиентом учёта</span>':''}</div><div class="actions"><button id="editCompany">Изменить</button><button id="deleteCompany" class="danger">Удалить</button></div><label style="margin-top:16px">Статус<select id="cardStatus">${options(d.status)}</select></label>${d.reason?`<p>Причина: ${esc(d.reason)}</p>`:''}<div class="panel"><h3>О компании и впечатление</h3><div class="note">${esc(d.notes||'Пока нет заметок')}</div></div><div class="panel"><h3>Контакты</h3>${d.contacts.map(c=>`<div class="contact"><b>${esc(c.name||'Без имени')}</b><div class="muted">${esc(c.role)}</div><div>${esc(c.phone)}${c.email?' · '+esc(c.email):''}</div>${links(c)}</div>`).join('')||'<p class="muted">Добавьте контакты через «Изменить»</p>'}<p class="muted">Telegram по номеру зависит от приватности. Если известен @username, укажите его в контакте.</p></div><div class="panel"><div class="dialog-top"><h3>Следующие действия</h3><button class="small" id="addTask">+ Добавить</button></div>${d.tasks.map(t=>`<div class="task-row"><input type="checkbox" data-task="${t.id}" data-company="${id}" aria-label="Выполнить задачу" ${t.done?'checked':''}><div class="text">${esc(t.text)}<div class="muted">${date(t.date)} · ${t.done?'Выполнено':'Открыто'}</div></div><button class="small" data-edit-task="${t.id}">Изменить</button><button class="small danger" data-delete-task="${t.id}">Удалить</button></div>`).join('')||'<p class="muted">Следующее действие не назначено</p>'}</div><div class="panel"><div class="dialog-top"><h3>История общения</h3><button class="small" id="addEvent">+ Запись</button></div>${[...d.events].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="event"><div class="actions"><button class="small" data-edit-event="${e.id}">Изменить</button><button class="small danger" data-delete-event="${e.id}">Удалить</button></div><div class="muted">${date(e.date)} · ${esc(e.type)}</div>${esc(e.text)}</div>`).join('')||'<p class="muted">Нет записей</p>'}</div><div id="formError" class="error"></div>`);
 $('editCompany').onclick=()=>editCompany(id);$('deleteCompany').onclick=()=>deleteCompany(id);$('cardStatus').onchange=async e=>{await statusChange(id,e.target.value);openCard(id)};$('addTask').onclick=()=>editChild(id,'tasks');$('addEvent').onclick=()=>editChild(id,'events');
 $('modal').querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>editChild(id,'tasks',b.dataset.editTask));$('modal').querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>editChild(id,'events',b.dataset.editEvent));
 $('modal').querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>deleteChild(id,'tasks',b.dataset.deleteTask));$('modal').querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=()=>deleteChild(id,'events',b.dataset.deleteEvent));
 $('modal').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);notify('Номер скопирован')}catch(e){prompt('Скопируйте номер',b.dataset.copy)}});
}
function contactFields(c={}){return `<div class="contact-editor"><div class="grid"><label>Имя<input data-field="name" value="${esc(c.name)}"></label><label>Должность<input data-field="role" value="${esc(c.role)}"></label><label>Телефон<input data-field="phone" value="${esc(c.phone)}" placeholder="+7…"></label><label>Почта<input type="email" data-field="email" value="${esc(c.email)}"></label><label>Telegram @username<input data-field="telegram" value="${esc(c.telegram)}"></label></div><button type="button" class="small danger remove-contact">Удалить контакт</button></div>`}
function editCompany(id){const r=rows.find(x=>x.id===id),d=r?clone(r.document):{id:uid(),name:'',sector:'',location:'',notes:'',status:'first',reason:'',contacts:[],events:[],tasks:[],client_id:null};
 show(top(r?'Изменить компанию':'Добавить компанию')+`<form id="companyForm"><div class="grid"><label>Компания *<input id="fName" required maxlength="200" value="${esc(d.name)}"></label><label>Сфера<input id="fSector" value="${esc(d.sector)}" placeholder="Клиника, отель, девелопер…"></label><label>Локация / адрес<input id="fLocation" value="${esc(d.location)}"></label><label>Статус<select id="fStatus">${options(d.status)}</select></label><label class="full" id="reasonLabel">Причина неактуальности<input id="fReason" value="${esc(d.reason)}"></label><label class="full">Заметки / впечатление<textarea id="fNotes">${esc(d.notes)}</textarea></label>${mode==='cloud'?`<label class="full">Связь с клиентом складской CRM<select id="fClient"><option value="">Без связи</option>${clients.map(c=>`<option value="${c.id}" ${d.client_id===c.id?'selected':''}>${esc(c.company_name)}</option>`).join('')}</select></label>`:''}</div><h3>Контактные лица</h3><div id="contactsEditor">${d.contacts.map(contactFields).join('')}</div><button type="button" id="newContact">+ Контакт</button>${!r?`<div class="panel"><label>Первая запись<textarea id="firstNote" placeholder="Куда зашли, с кем говорили, что обсудили…"></textarea></label><label>Дата визита<input type="date" id="firstDate" value="${today()}" required></label><label>Следующее действие<input id="firstTask" placeholder="Отправить предложение…"></label><label>Срок действия<input type="date" id="firstTaskDate"></label></div>`:''}<div id="formError" class="error"></div><div class="foot"><button type="button" id="cancelForm">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form>`);
 const reason=()=>{$('reasonLabel').classList.toggle('hidden',$('fStatus').value!=='lost');$('fReason').required=$('fStatus').value==='lost'};reason();$('fStatus').onchange=reason;
 $('newContact').onclick=()=>$('contactsEditor').insertAdjacentHTML('beforeend',contactFields());$('contactsEditor').onclick=e=>{if(e.target.classList.contains('remove-contact'))e.target.closest('.contact-editor').remove()};$('cancelForm').onclick=()=>r?openCard(id):$('modal').close();
 $('companyForm').onsubmit=async e=>{e.preventDefault();try{d.name=$('fName').value.trim();d.sector=$('fSector').value.trim();d.location=$('fLocation').value.trim();d.notes=$('fNotes').value.trim();d.reason=$('fStatus').value==='lost'?$('fReason').value.trim():'';
 const match=rows.find(x=>x.id!==d.id&&identity(x.document)===identity(d));if(match)throw new Error('Компания с этой локацией уже есть. Откройте её карточку.');
 d.contacts=[...$('contactsEditor').children].map(el=>Object.fromEntries([...el.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value.trim()]))).filter(c=>Object.values(c).some(Boolean));for(const c of d.contacts){if(c.phone&&!phone(c.phone))throw new Error('Проверьте телефон: '+c.phone);if(c.telegram&&!/^[a-zA-Z0-9_]{5,32}$/.test(c.telegram.replace(/^@/,'')))throw new Error('Проверьте Telegram username');}
 if($('fClient'))d.client_id=$('fClient').value||null;
 if(d.status!==$('fStatus').value){stamp(d,`Статус: ${stage(d.status)} → ${stage($('fStatus').value)}${d.reason?' · '+d.reason:''}`);d.status=$('fStatus').value}
 if(!r){if($('firstNote').value.trim())stamp(d,$('firstNote').value.trim(),'Личный визит',$('firstDate').value);if($('firstTask').value.trim())d.tasks.push({id:uid(),text:$('firstTask').value.trim(),date:$('firstTaskDate').value,done:false})}else stamp(d,'Данные компании изменены');
 await save([{document:d,revision:r?.revision||0}]);notify('Компания сохранена');openCard(d.id)}catch(e){err(e)}};
}
function editChild(id,kind,childId){const r=rows.find(x=>x.id===id),d=clone(r.document),old=d[kind].find(x=>x.id===childId),isTask=kind==='tasks';show(top((old?'Изменить':'Добавить')+(isTask?' действие':' запись'))+`<form id="childForm"><label>${isTask?'Действие':'Что произошло'} *<textarea id="childText" required>${esc(old?.text)}</textarea></label><label>${isTask?'Срок':'Дата'}<input type="date" id="childDate" ${isTask?'':'required'} value="${esc(old?.date||(isTask?'':today()))}"></label>${isTask?'':`<label>Тип<select id="childType">${['Личный визит','Звонок','Переписка','Письмо','Заметка','system'].map(t=>`<option ${t===old?.type?'selected':''}>${t}</option>`).join('')}</select></label>`}<div id="formError" class="error"></div><div class="foot"><button type="button" id="childCancel">Отмена</button><button class="primary">Сохранить</button></div></form>`);$('childCancel').onclick=()=>openCard(id);$('childForm').onsubmit=async e=>{e.preventDefault();const text=$('childText').value.trim();if(!text){err('Введите текст');return}const child={id:old?.id||uid(),text,date:$('childDate').value,...(isTask?{done:old?.done||false}:{type:$('childType').value})};if(old)d[kind][d[kind].findIndex(x=>x.id===old.id)]=child;else d[kind].push(child);try{await save([{document:d,revision:r.revision}]);openCard(id)}catch(e){err(e)}}}
async function deleteChild(id,kind,childId){if(!confirm('Удалить '+(kind==='tasks'?'действие':'запись')+'?'))return;const r=rows.find(x=>x.id===id),d=clone(r.document);d[kind]=d[kind].filter(x=>x.id!==childId);try{await save([{document:d,revision:r.revision}]);openCard(id)}catch(e){err(e)}}
async function deleteCompany(id){const r=rows.find(x=>x.id===id);if(!confirm(`Удалить «${r.document.name}», все контакты, историю и задачи? Складские заказы и оплаты сохранятся.`))return;try{if(mode==='cloud')rows=(await request('delete',{id,revision:r.revision})).data;else{const updated=rows.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(updated));rows=updated}$('modal').close();render();notify('Компания удалена')}catch(e){err(e)}}
async function toggleTask(id,taskId,done){const r=rows.find(x=>x.id===id),d=clone(r.document),t=d.tasks.find(t=>t.id===taskId);t.done=done;stamp(d,`${done?'Выполнено':'Возобновлено'}: ${t.text}`);try{await save([{document:d,revision:r.revision}]);if($('modal').open)openCard(id)}catch(e){render();if($('modal').open)openCard(id);err(e)}}
const EXAMPLE={version:1,companies:[{name:'Название компании',location:'Локация или адрес',sector:'Сфера',contacts:[{name:'Имя',role:'Должность',phone:'+7 999 000-00-00',email:'',telegram:''}],status:'first',notes:'Впечатление от визита',interaction:{date:'2026-10-08',type:'Личный визит',text:'С кем общались и о чём договорились'},next_action:{text:'Отправить предложение',date:'2026-10-12'}}]};
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s}
function validateReport(raw){if(!raw||raw.version!==1||!Array.isArray(raw.companies)||!raw.companies.length||raw.companies.length>100)throw new Error('Нужен формат {version:1, companies:[…]}, от 1 до 100 компаний.');
 return raw.companies.map((c,i)=>{if(!c||typeof c.name!=='string'||!c.name.trim()||c.name.length>200)throw new Error('Не указана компания в записи '+(i+1));if(c.status&&!STAGES.some(s=>s[0]===c.status))throw new Error('Неизвестный статус: '+c.status);if(c.status==='lost'&&!c.reason?.trim())throw new Error('Укажите reason для «Неактуально»');
 for(const k of ['location','sector','notes','reason'])if(c[k]!=null&&typeof c[k]!=='string')throw new Error('Поле '+k+' должно быть текстом');
 if(c.contacts!=null&&!Array.isArray(c.contacts))throw new Error('contacts должен быть массивом');for(const p of c.contacts||[]){if(!p||typeof p!=='object')throw new Error('Некорректный контакт');for(const k of ['name','role','phone','email','telegram'])if(p[k]!=null&&typeof p[k]!=='string')throw new Error('Некорректный контакт: '+k);if(p.phone&&!phone(p.phone))throw new Error('Проверьте номер: '+p.phone);if(p.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))throw new Error('Проверьте почту: '+p.email);if(p.telegram&&!/^[a-zA-Z0-9_]{5,32}$/.test(p.telegram.replace(/^@/,'')))throw new Error('Проверьте Telegram username')}
 const events=[...(c.events||[]),...(c.interaction?[c.interaction]:[])],tasks=[...(c.tasks||[]),...(c.next_action?[c.next_action]:[])];for(const ev of events)if(typeof ev.text!=='string'||!ev.text.trim()||!validDate(ev.date))throw new Error('Запись истории требует text и корректную дату YYYY-MM-DD');for(const t of tasks)if(typeof t.text!=='string'||!t.text.trim()||t.date&&!validDate(t.date))throw new Error('Действие требует text и корректную дату или пустую дату');return {...c,name:c.name.trim(),location:(c.location||'').trim(),events,tasks};});}
function planImport(raw){const cs=validateReport(raw),used=new Set();return cs.map(c=>{const key=identity(c);if(used.has(key))throw new Error('Компания повторяется в отчёте: '+c.name+'. Объедините её записи.');used.add(key);const existing=rows.find(r=>identity(r.document)===key);const d=existing?clone(existing.document):{id:uid(),name:c.name,location:c.location,sector:'',notes:'',status:'first',reason:'',contacts:[],events:[],tasks:[],client_id:null};
 if(c.sector)d.sector=c.sector;if(c.notes&&!d.notes.includes(c.notes))d.notes=[d.notes,c.notes].filter(Boolean).join('\n\n');
 for(const p of c.contacts||[]){const clean=Object.fromEntries(['name','role','phone','email','telegram'].map(k=>[k,p[k]||'']));const old=d.contacts.find(x=>p.phone&&phone(x.phone)===phone(p.phone)||p.email&&norm(x.email)===norm(p.email)||p.name&&norm(x.name)===norm(p.name));if(old){for(const k of Object.keys(clean))if(clean[k])old[k]=clean[k]}else d.contacts.push(clean)}
 for(const ev of c.events){if(!d.events.some(x=>x.date===ev.date&&x.text===ev.text&&(x.type||'Заметка')===(ev.type||'Заметка')))d.events.push({id:uid(),date:ev.date,text:ev.text,type:ev.type||'Заметка'})}
 for(const t of c.tasks){if(!d.tasks.some(x=>x.text===t.text&&(x.date||'')===(t.date||'')))d.tasks.push({id:uid(),text:t.text,date:t.date||'',done:!!t.done})}
 if(c.status&&d.status!==c.status){stamp(d,`Статус: ${stage(d.status)} → ${stage(c.status)}${c.reason?' · '+c.reason:''}`);d.status=c.status}if(d.status==='lost'&&c.reason)d.reason=c.reason;if(d.status!=='lost')d.reason='';
 return {document:d,revision:existing?.revision||0,unchanged:existing&&JSON.stringify(d)===JSON.stringify(existing.document)};});}
function importDialog(){let plan=null;show(top('Вставить отчёт')+`<p class="muted">Надиктуйте обход любой нейросети и попросите оформить по шаблону ниже. Вставьте JSON сюда. Произвольную речь это поле не разбирает.</p><details><summary>Шаблон для нейросети</summary><p class="muted">Сохрани version:1. Не выдумывай контакты, даты, статусы и договорённости. Если статус не известен, не включай status. Коды: first — первичный обход, talk — переговоры, test — тестовая поставка, active — сотрудничество, lost — неактуально (нужна reason). Несколько компаний — несколько объектов в companies.</p><pre>${esc(JSON.stringify(EXAMPLE,null,2))}</pre><button class="small" id="templateBtn">Вставить шаблон</button></details><textarea id="importText" style="min-height:190px;margin-top:16px" aria-label="JSON отчёта" placeholder='{"version":1,"companies":[…]}'></textarea><div id="importPreview" class="import-preview"></div><div id="formError" class="error"></div><div class="foot"><button id="parseBtn">Проверить</button><button id="applyImport" class="primary" disabled>Сохранить в ${mode==='cloud'?'Supabase':'просмотр'}</button></div>`);
 $('templateBtn').onclick=()=>{$('importText').value=JSON.stringify(EXAMPLE,null,2);invalidate()};const invalidate=()=>{plan=null;$('applyImport').disabled=true;$('importPreview').innerHTML='';$('formError').textContent=''};$('importText').oninput=invalidate;
 $('parseBtn').onclick=()=>{try{const txt=$('importText').value.trim().replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');plan=planImport(JSON.parse(txt));$('formError').textContent='';$('importPreview').innerHTML=plan.map(i=>`<div class="panel"><b>${esc(i.document.name)}</b> · ${i.unchanged?'Уже импортировано':i.revision?'Дополнить карточку':'Новая компания'}<div class="muted">${esc(i.document.location)} · ${stage(i.document.status)} · ${i.document.contacts.length} контактов · ${i.document.events.length} записей · ${i.document.tasks.length} задач</div>${i.document.events.slice(-2).map(e=>`<p>${date(e.date)}: ${esc(e.text)}</p>`).join('')}${i.document.contacts.map(c=>`<p>${esc(c.name)} · ${esc(c.phone)} · ${esc(c.email)}</p>`).join('')}</div>`).join('');$('applyImport').disabled=plan.every(i=>i.unchanged)}catch(e){plan=null;$('applyImport').disabled=true;err(e)}};
 $('applyImport').onclick=async()=>{if(!plan)return;try{await save(plan.filter(i=>!i.unchanged).map(({document,revision})=>({document,revision})));$('modal').close();notify('Отчёт сохранён')}catch(e){err(e)}};
}
async function connect(){if(mode==='cloud'){notify('Облачная база уже подключена');return}try{if(localStorage.getItem('nastebel_crm_session')){const r=await request('load');const c=await request('clients');rows=r.data;clients=c.data;mode='cloud';render();return}}catch(e){}
 show(top('Подключение к Supabase')+`<p>Введите тот же пароль, с которым входите в CRM.</p><p class="muted">Просмотр и облачная база разделены: тестовые изменения автоматически не переносятся. Данные из облака загрузятся после входа.</p><form id="loginForm"><label>Пароль CRM<input id="password" type="password" required autocomplete="current-password"></label><div id="formError" class="error"></div><div class="foot"><button class="primary">Подключить</button></div></form>`);
 $('loginForm').onsubmit=async e=>{e.preventDefault();try{const res=await fetch(LOGIN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:$('password').value})});const b=await res.json();if(!res.ok)throw new Error(b.error||'Ошибка входа');localStorage.setItem('nastebel_crm_session',b.token);const loaded=await request('load'),c=await request('clients');rows=loaded.data;clients=c.data;mode='cloud';$('modal').close();render();notify('Подключено к Supabase')}catch(e){err(e)}};
}
function exportData(){const file=new Blob([JSON.stringify({version:1,companies:rows.map(r=>r.document)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='nastebel-communications-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('Экспорт подготовлен')}
$('addBtn').onclick=()=>editCompany();$('importBtn').onclick=importDialog;$('cloudBtn').onclick=connect;$('exportBtn').onclick=exportData;$('search').oninput=render;$('taskFilter').onchange=render;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
document.addEventListener('click',e=>{const target=e.target.closest('[data-open]');if(target&&!e.target.closest('select'))openCard(target.dataset.open)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-open]')){e.preventDefault();openCard(e.target.dataset.open)}});
document.addEventListener('change',e=>{if(e.target.dataset.status)statusChange(e.target.dataset.status,e.target.value);if(e.target.dataset.task)toggleTask(e.target.dataset.company,e.target.dataset.task,e.target.checked)});
localLoad();render();
</script></body></html>
